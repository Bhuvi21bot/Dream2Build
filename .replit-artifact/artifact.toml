kind = "web"
previewPath = "/"
title = "Dream2Build"
description = "Dream2Build is a premium AI-powered home design platform. It lets homeowners, architects, interior designers, and builders describe their requirements and get AI-generated floor plans, cost estimates, material BOQs, climate analysis, furniture recommendations, and construction timelines — all in one beautiful interface."
version = "1.0.0"
id = "artifacts/dream2build"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19513

[services.development]
run = "pnpm --filter @workspace/dream2build run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dream2build", "run", "build" ]
serve = "static"
publicDir = "artifacts/dream2build/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19513"
BASE_PATH = "/"
